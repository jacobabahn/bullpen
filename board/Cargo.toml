[package]
name = "bullpen-board"
version = "0.1.0"
edition = "2021"
description = "bullpen's task board: a live list of tasks to switch between"

[dependencies]
ratatui = "0.29"
ansi-to-tui = "7"
chrono = "0.4"
notify = "6.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"

[profile.release]
opt-level = 3
