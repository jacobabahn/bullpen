[package]
name = "bullpen-board"
version = "0.1.0"
edition = "2021"
description = "bullpen's task board: a live list of tasks to switch between"

[dependencies]
# tasks, settings and the sentences bullpen's command line says too
bullpen-core = { path = "../core" }
ratatui = "0.29"
ansi-to-tui = "7"
chrono = "0.4"
notify = "6.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# the image look (image/): a rasteriser, fonts, and zlib for its PNGs
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
ttf-parser = "0.25"
miniz_oxide = "0.9"
# reading the terminal's answers (image/term.rs)
libc = "0.2"
