[package]
name = "bullpen-cli"
version = "0.1.0"
edition = "2021"
description = "bullpen's command line: the commands moved to Rust, and the hand-over to the Python for the rest"

[[bin]]
name = "bullpen"
path = "src/main.rs"

[dependencies]
bullpen-core = { path = "../core" }
# the tour drawn as images (stepper/look/), as the board's image look draws
bullpen-draw = { path = "../draw" }
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"
