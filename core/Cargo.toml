[package]
name = "bullpen-core"
version = "0.1.0"
edition = "2021"
description = "bullpen's tasks, config and wording: what its command line and board share"

[lib]
name = "bullpen_core"
path = "src/lib.rs"

[dependencies]
# preserve_order: a task's keys stay in the order its file has them, as Python's dict keeps them
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"
