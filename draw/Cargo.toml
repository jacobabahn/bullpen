[package]
name = "bullpen-draw"
version = "0.1.0"
edition = "2021"
description = "what bullpen's image look draws with: fonts, shapes, colours, PNG and the kitty graphics protocol, for the board and the tour"

[dependencies]
# a rasteriser, fonts, and zlib for the PNGs
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
ttf-parser = "0.25"
miniz_oxide = "0.9"
