# One workspace: core (what the command line and the board share), cli (bin "bullpen")
# and board (bin "bullpen-board"). Built products go to target/; bullpen runs the copies
# it renames into place there (target/bullpen, target/bullpen-board), never cargo's own.
[workspace]
members = ["core", "cli", "board"]
resolver = "2"

[profile.release]
opt-level = 3
