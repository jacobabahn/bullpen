# One workspace: core (what the command line and the board share), cli (bin "bullpen"),
# board (bin "bullpen-board"), web (bin "bullpen-web", the page `bullpen web` serves),
# draw (what the board's image look and the tour draw with) and tests/fakes (the tests'
# fake rex and gh; only tests/run.py builds it).
# Built products go to target/; bullpen runs the copies it renames into place there
# (target/bullpen, target/bullpen-board, target/bullpen-web), never cargo's own.
[workspace]
members = ["core", "cli", "board", "web", "draw", "tests/fakes"]
resolver = "2"

[profile.release]
opt-level = 3
